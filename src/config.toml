[server]
host = "0.0.0.0"
# 监听端口
port = 5000
# Github文件大小限制（字节），默认2GB
fileSize = 2147483648
enableFrontend = true
# 水位线缓冲区大小（字节），默认 8MB
# 100Mbps 服务器建议 8MB，500Mbps 建议 16MB，1Gbps 建议 32MB
bufferSize = 8388608
# GitHub Personal Access Token (PAT)，用于服务器端 API 限流
# 仅在用户未提供 token 时对 api.github.com 请求生效，不影响文件下载
# 留空则不使用
githubToken = ""

[rateLimit]
# API 搜索请求每小时最大请求数，默认 1200（GitHub 认证限额 30次/分钟 的 2/3）
apiSearchHourly = 1200
# API Release 请求每小时最大请求数，默认 3333
apiReleaseHourly = 3333
# API Repo 请求每小时最大请求数，默认 3333
apiRepoHourly = 3333
# API 其他请求每小时最大请求数，默认 3333
apiOtherHourly = 3333
# 下载限速（字节/秒），0=不限速，对白名单用户无效
# 示例: 5242880 = 5MB/s, 10485760 = 10MB/s
downloadBytesPerSec = 0
# 全局限速（字节/秒），所有未认证用户共享，0=不限速
globalBytesPerSec = 0
# IP 请求频率限制（次/小时），白名单 token 豁免，0=不限
ipRequestLimit = 0

[access]
# GitHub仓库白名单（支持通配符）
# 只允许访问白名单中的仓库，为空时不限制
whiteList = []

# GitHub仓库黑名单（支持通配符）
# 禁止访问黑名单中的仓库
blackList = [
    "baduser/malicious-repo",
    "*/malicious-repo",
    "baduser/*"
]

# 代理配置，支持有用户名/密码认证和无认证模式
# 无认证: socks5://127.0.0.1:1080
# 有认证: socks5://username:password@127.0.0.1:1080
# 留空不使用代理
proxy = "" 

# [可选] Token 白名单
# 白名单中的 GitHub Token 不限速（通过请求头 X-GitHub-Token 或查询参数 ?token= 传入）
# 环境变量: TOKEN_WHITELIST=ghp_xxx,ghp_yyy
[tokenWhiteList]
# GitHub Token 白名单，留空表示无人豁免限速
tokens = []
