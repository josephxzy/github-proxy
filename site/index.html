    <script>
      (function () {
        var base = "/github-proxy";
        var params = new URLSearchParams(window.location.search);
        var fallbackPath = params.get("p");
        if (fallbackPath) {
          var normalizedFallback = fallbackPath.charAt(0) === "/" ? fallbackPath : "/" + fallbackPath;
          window.history.replaceState(null, "", base + normalizedFallback);
          return;
        }
        if (window.location.hash.indexOf("#/") === 0) {
          window.history.replaceState(null, "", base + window.location.hash.slice(1));
        }
      })();
    </script>
